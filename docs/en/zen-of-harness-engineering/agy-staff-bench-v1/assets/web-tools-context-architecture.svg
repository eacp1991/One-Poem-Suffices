<svg viewBox="0 0 940 554" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4">
  <title id="t4">Two context architectures for web tools: Claude Code spawns a sidecar sub-model inside the tool so raw pages are read once off-path and only a few thousand chars return to the main model; Codex appends raw text slices directly into the main window, relying on prefix cache for re-reads with a larger main context.</title>
  <style>
    .zh  { font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .mono{ font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  </style>
  <defs>
    <pattern id="dots4" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#2B2722" opacity="0.045"/>
    </pattern>
    <marker id="ah-ink4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B948A"/>
    </marker>
    <marker id="ah-coral4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
    <marker id="ah-coral4b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <rect width="940" height="554" fill="#FFFFFF"/>
  <rect width="940" height="554" fill="url(#dots4)"/>

  <!-- ═══ 左栏：Claude Code ═══ -->
  <rect x="40" y="34" width="420" height="414" rx="16" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="60" y="64" font-size="15" font-weight="600" fill="#2B2722">Claude Code: In-tool sub-model</text>
  <text class="mono" x="440" y="64" font-size="10.5" fill="#9B948A" text-anchor="end">2.1.296</text>
  <text class="zh" x="60" y="84" font-size="11" fill="#9B948A">Raw pages stay out of the main window; only answers return</text>
  <line x1="60" y1="98" x2="440" y2="98" stroke="#EFE9E1" stroke-width="1"/>

  <!-- 主模型 -->
  <rect x="60" y="114" width="380" height="40" rx="9" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3"/>
  <text class="zh" x="76" y="139" font-size="12.5" font-weight="600" fill="#2B2722">Main Model Opus 5.5</text>
  <text class="zh" x="424" y="139" font-size="10.5" fill="#9B948A" text-anchor="end">Has Bash &amp; file R/W permissions</text>

  <!-- 调用 / 回传箭头 -->
  <line x1="110" y1="156" x2="110" y2="200" stroke="#9B948A" stroke-width="1.2" marker-end="url(#ah-ink4)"/>
  <line x1="190" y1="200" x2="190" y2="158" stroke="#D97757" stroke-width="1.5" marker-end="url(#ah-coral4)"/>
  <text class="mono" x="198" y="183" font-size="10.5" fill="#B85C39">~4k chars</text>
  <line x1="300" y1="156" x2="300" y2="200" stroke="#9B948A" stroke-width="1.2" marker-end="url(#ah-ink4)"/>
  <line x1="380" y1="200" x2="380" y2="158" stroke="#D97757" stroke-width="1.5" marker-end="url(#ah-coral4)"/>
  <text class="mono" x="372" y="183" font-size="10.5" fill="#B85C39" text-anchor="end">~1k chars</text>

  <!-- WebSearch -->
  <rect x="60" y="202" width="180" height="70" rx="9" fill="#FFFDFB" stroke="#D97757" stroke-width="1.2"/>
  <text class="mono" x="76" y="224" font-size="11.5" font-weight="600" fill="#2B2722">WebSearch</text>
  <text class="zh" x="76" y="243" font-size="11" fill="#2B2722">Opus sidecar summarizes</text>
  <text class="zh" x="76" y="261" font-size="10.5" fill="#9B948A">Uncached · ~$0.08/call · ~14s</text>

  <!-- WebFetch -->
  <rect x="260" y="202" width="180" height="82" rx="9" fill="#FFFDFB" stroke="#D97757" stroke-width="1.2"/>
  <text class="mono" x="276" y="224" font-size="11.5" font-weight="600" fill="#2B2722">WebFetch</text>
  <text class="zh" x="276" y="243" font-size="11" fill="#2B2722">Haiku 5.5 extracts by query</text>
  <text class="zh" x="276" y="261" font-size="10.5" fill="#9B948A">Single turn · No tools<tspan x="276" dy="15">Fence-isolated</tspan></text>

  <!-- 原始内容：旁路里读一次 -->
  <rect x="60" y="296" width="380" height="54" rx="9" fill="#FFFFFF" stroke="#BDB6AB" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="76" y1="312" x2="176" y2="312" stroke="#E4DFD8"/>
    <line x1="76" y1="324" x2="190" y2="324" stroke="#D8D2C9"/>
    <line x1="76" y1="336" x2="168" y2="336" stroke="#E4DFD8"/>
  </g>
  <text class="zh" x="424" y="320" font-size="11" fill="#6B655C" text-anchor="end">Search snippets / Full web page</text>
  <text class="zh" x="424" y="337" font-size="10.5" fill="#9B948A" text-anchor="end">Read once in sidecar, then discarded</text>

  <!-- 主 context 条 -->
  <text class="zh" x="60" y="378" font-size="10.5" fill="#9B948A">Main context · Median per call (DSQA solo)</text>
  <rect x="60" y="386" width="97" height="12" rx="6" fill="#6B655C"/>
  <text class="mono" x="166" y="396.5" font-size="11.5" fill="#2B2722">27k</text>
  <text class="zh" x="60" y="418" font-size="11.5" fill="#2B2722">Less noise + injection isolation<tspan x="60" dy="17">Trade-off: uncached sidecar, lossy summaries</tspan></text>

  <!-- ═══ 右栏：Codex ═══ -->
  <rect x="480" y="34" width="420" height="414" rx="16" fill="#FFFDFB" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="500" y="64" font-size="15" font-weight="600" fill="#2B2722">Codex: Raw text in main context</text>
  <text class="mono" x="880" y="64" font-size="10.5" fill="#9B948A" text-anchor="end">0.160.1</text>
  <text class="zh" x="500" y="84" font-size="11" fill="#9B948A">No tool-layer processing; re-reads via append-only prefix cache</text>
  <line x1="500" y1="98" x2="880" y2="98" stroke="#EFE9E1" stroke-width="1"/>

  <!-- 主模型 -->
  <rect x="500" y="114" width="380" height="40" rx="9" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3"/>
  <text class="zh" x="516" y="139" font-size="12.5" font-weight="600" fill="#2B2722">Main Model GPT-6.1 Sol</text>
  <text class="zh" x="864" y="139" font-size="10.5" fill="#9B948A" text-anchor="end">Also holds shell permissions</text>

  <!-- 调用 / 回传 -->
  <line x1="550" y1="156" x2="550" y2="200" stroke="#9B948A" stroke-width="1.2" marker-end="url(#ah-ink4)"/>
  <line x1="640" y1="200" x2="640" y2="160" stroke="#D97757" stroke-width="9" stroke-linecap="butt" opacity="0.85" marker-end="url(#ah-coral4b)"/>
  <text class="mono" x="660" y="176" font-size="10.5" fill="#B85C39">24k~40k raw chars / call</text>
  <text class="mono" x="660" y="192" font-size="10" fill="#9B948A">contains_external_context</text>

  <!-- web.run -->
  <rect x="500" y="202" width="380" height="70" rx="9" fill="#FFFDFB" stroke="#D97757" stroke-width="1.2"/>
  <text class="mono" x="516" y="224" font-size="11.5" font-weight="600" fill="#2B2722">web.run</text>
  <text class="zh" x="516" y="243" font-size="11" fill="#2B2722">Up to 4 queries per call, plus open / find</text>
  <text class="zh" x="516" y="261" font-size="10.5" fill="#9B948A">Request includes conversation tail · 2~7.5s/call</text>

  <!-- 原文进了主历史 -->
  <rect x="500" y="296" width="380" height="54" rx="9" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.2"/>
  <g>
    <rect x="512" y="306" width="38" height="34" rx="4" fill="#EAE4DB"/>
    <rect x="554" y="306" width="32" height="34" rx="4" fill="#E9C9BC"/>
    <rect x="590" y="306" width="12" height="34" rx="4" fill="#DFD8CD"/>
    <rect x="606" y="306" width="28" height="34" rx="4" fill="#E9C9BC"/>
  </g>
  <text class="zh" x="864" y="320" font-size="11" fill="#6B655C" text-anchor="end">Raw text stays in main history</text>
  <text class="zh" x="864" y="337" font-size="10.5" fill="#9B948A" text-anchor="end">Subsequent turns cache read at $0.10/M</text>

  <!-- 主 context 条 -->
  <text class="zh" x="500" y="378" font-size="10.5" fill="#9B948A">Main context · Median per call (DSQA solo)</text>
  <rect x="500" y="386" width="299" height="12" rx="6" fill="#D97757"/>
  <text class="mono" x="808" y="396.5" font-size="11.5" fill="#2B2722">83k</text>
  <text class="zh" x="500" y="430" font-size="11.5" fill="#2B2722">Fast, full context, cheap re-reads; cost is context bloat</text>

  <!-- ═══ 底部：agy 对照 ═══ -->
  <rect x="40" y="466" width="860" height="64" rx="10" fill="#FFFFFF" stroke="#D9D4CC" stroke-width="1.2"/>
  <text class="mono" x="60" y="491" font-size="11.5" font-weight="600" fill="#2B2722">agy 1.3.0</text>
  <text class="mono" x="150" y="491" font-size="11" fill="#6B655C">search_web</text>
  <text class="zh" x="232" y="491" font-size="11" fill="#9B948A">Server-side helper model<tspan x="232" dy="17">~2KB summary + links</tspan></text>
  <text class="mono" x="530" y="491" font-size="11" fill="#6B655C">read_url_content</text>
  <text class="zh" x="652" y="491" font-size="11" fill="#9B948A">Full text directly into context</text>
</svg>
