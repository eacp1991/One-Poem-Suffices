<svg viewBox="0 0 940 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1">
  <title id="t1">Two harness mechanisms while waiting for agy: Claude Code ends the current turn, wakes via task-notification, hits the 1h cache on wakeup, with waiting taking only 9.8% of Host cost; codex exec must poll roughly every 25s within the same turn, with waiting taking 48% of Host cost. Right: Host cost multiple vs. solo; excluding wait cost, both are below solo.</title>
  <style>
    .zh  { font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .mono{ font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  </style>
  <defs>
    <pattern id="dots1" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#2B2722" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="940" height="490" fill="#FFFFFF"/>
  <rect width="940" height="490" fill="url(#dots1)"/>

  <!-- ═══ 上：Claude Code ═══ -->
  <rect x="30" y="34" width="600" height="190" rx="16" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="50" y="64" font-size="15" font-weight="600" fill="#2B2722">Claude Code: End turn, await notification</text>
  <text class="mono" x="610" y="64" font-size="10.5" fill="#9B948A" text-anchor="end">2.1.296 · Main thread 1h TTL cache</text>
  <line x1="50" y1="76" x2="610" y2="76" stroke="#EFE9E1" stroke-width="1"/>

  <text class="zh" x="50" y="128" font-size="11" fill="#9B948A">Main thread</text>
  <text class="zh" x="132" y="106" font-size="11" fill="#2B2722" text-anchor="middle">Dispatch</text>
  <circle cx="132" cy="124" r="3.5" fill="#2B2722"/>
  <line x1="146" y1="124" x2="548" y2="124" stroke="#D9D4CC" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/>
  <!-- 稀疏调用 -->
  <g stroke="#9B948A" stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="118" x2="160" y2="130"/>
    <line x1="300" y1="118" x2="300" y2="130"/>
    <line x1="430" y1="118" x2="430" y2="130"/>
  </g>
  <line x1="548" y1="112" x2="548" y2="136" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
  <text class="mono" x="548" y="104" font-size="10.5" fill="#B85C39" text-anchor="middle">&lt;task-notification&gt;</text>
  <line x1="560" y1="124" x2="604" y2="124" stroke="#2B2722" stroke-width="5" stroke-linecap="round"/>
  <text class="zh" x="582" y="146" font-size="10.5" fill="#6B655C" text-anchor="middle">Wrap-up</text>
  <text class="zh" x="146" y="150" font-size="10.5" fill="#9B948A">Turn ends; wait expiry or job exit wakes it, with a cache hit</text>

  <line x1="50" y1="168" x2="610" y2="168" stroke="#EFE9E1" stroke-width="1"/>
  <text class="zh" x="50" y="198" font-size="13.5" font-weight="600" fill="#2F8F6B">Wait cost $1.50 (9.8% of Host)</text>
  <text class="mono" x="610" y="198" font-size="10.5" fill="#9B948A" text-anchor="end">300 min · 96 calls · 0.32 calls/min</text>

  <!-- ═══ 下：codex exec ═══ -->
  <rect x="30" y="248" width="600" height="190" rx="16" fill="#FFFDFB" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="50" y="278" font-size="15" font-weight="600" fill="#2B2722">codex exec: Poll within the same turn</text>
  <text class="mono" x="610" y="278" font-size="10.5" fill="#9B948A" text-anchor="end">0.160.1 · Non-interactive mode</text>
  <line x1="50" y1="290" x2="610" y2="290" stroke="#EFE9E1" stroke-width="1"/>

  <text class="zh" x="50" y="342" font-size="11" fill="#9B948A">Main thread</text>
  <text class="zh" x="132" y="320" font-size="11" fill="#2B2722" text-anchor="middle">Dispatch</text>
  <circle cx="132" cy="338" r="3.5" fill="#2B2722"/>
  <text class="mono" x="352" y="318" font-size="10.5" fill="#B85C39" text-anchor="middle">write_stdin empty poll · ~every 25s</text>
  <!-- 密集轮询：与上轨同比例，约 7.4 倍密度 -->
  <g stroke="#D97757" stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="331" x2="160" y2="345"/><line x1="171" y1="331" x2="171" y2="345"/><line x1="182" y1="331" x2="182" y2="345"/><line x1="193" y1="331" x2="193" y2="345"/>
    <line x1="204" y1="331" x2="204" y2="345"/><line x1="215" y1="331" x2="215" y2="345"/><line x1="226" y1="331" x2="226" y2="345"/><line x1="237" y1="331" x2="237" y2="345"/>
    <line x1="248" y1="331" x2="248" y2="345"/><line x1="259" y1="331" x2="259" y2="345"/><line x1="270" y1="331" x2="270" y2="345"/><line x1="281" y1="331" x2="281" y2="345"/>
    <line x1="292" y1="331" x2="292" y2="345"/><line x1="303" y1="331" x2="303" y2="345"/><line x1="314" y1="331" x2="314" y2="345"/><line x1="325" y1="331" x2="325" y2="345"/>
    <line x1="336" y1="331" x2="336" y2="345"/><line x1="347" y1="331" x2="347" y2="345"/><line x1="358" y1="331" x2="358" y2="345"/><line x1="369" y1="331" x2="369" y2="345"/>
    <line x1="380" y1="331" x2="380" y2="345"/><line x1="391" y1="331" x2="391" y2="345"/><line x1="402" y1="331" x2="402" y2="345"/><line x1="413" y1="331" x2="413" y2="345"/>
    <line x1="424" y1="331" x2="424" y2="345"/><line x1="435" y1="331" x2="435" y2="345"/><line x1="446" y1="331" x2="446" y2="345"/><line x1="457" y1="331" x2="457" y2="345"/>
    <line x1="468" y1="331" x2="468" y2="345"/><line x1="479" y1="331" x2="479" y2="345"/><line x1="490" y1="331" x2="490" y2="345"/><line x1="501" y1="331" x2="501" y2="345"/>
    <line x1="512" y1="331" x2="512" y2="345"/><line x1="523" y1="331" x2="523" y2="345"/><line x1="534" y1="331" x2="534" y2="345"/><line x1="545" y1="331" x2="545" y2="345"/>
  </g>
  <line x1="560" y1="338" x2="604" y2="338" stroke="#2B2722" stroke-width="5" stroke-linecap="round"/>
  <text class="zh" x="582" y="360" font-size="10.5" fill="#6B655C" text-anchor="middle">Wrap-up</text>
  <text class="zh" x="146" y="364" font-size="10.5" fill="#9B948A">No cross-turn wakeup; each poll re-reads ~28k prefix</text>

  <line x1="50" y1="382" x2="610" y2="382" stroke="#EFE9E1" stroke-width="1"/>
  <text class="zh" x="50" y="412" font-size="13.5" font-weight="600" fill="#C0453A">Wait cost $4.67 (48% of Host)</text>
  <text class="mono" x="610" y="412" font-size="10.5" fill="#9B948A" text-anchor="end">366 min · 872 calls · 2.38 calls/min</text>

  <!-- ═══ 右：Host 成本 ÷ solo ═══ -->
  <rect x="650" y="34" width="260" height="404" rx="16" fill="#FFFFFF" stroke="#D9D4CC" stroke-width="1.2"/>
  <text class="zh" x="668" y="64" font-size="13" font-weight="600" fill="#2B2722">Host Cost ÷ solo</text>
  <circle cx="673" cy="84" r="4" fill="#2B2722"/>
  <text class="zh" x="682" y="88" font-size="10.5" fill="#6B655C">Actual</text>
  <circle cx="722" cy="84" r="4" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3"/>
  <text class="zh" x="731" y="88" font-size="10.5" fill="#6B655C">Excl. wait</text>

  <!-- solo = 1.0 参考线 -->
  <line x1="771.1" y1="100" x2="771.1" y2="384" stroke="#BDB6AB" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text class="mono" x="771.1" y="398" font-size="9.5" fill="#9B948A" text-anchor="middle">1.0 = solo</text>
  <text class="mono" x="726.7" y="398" font-size="9.5" fill="#BDB6AB" text-anchor="middle">0.5</text>
  <text class="mono" x="815.6" y="398" font-size="9.5" fill="#BDB6AB" text-anchor="middle">1.5</text>

  <!-- Claude 组 -->
  <text class="zh" x="668" y="118" font-size="11" fill="#2B2722">Claude Code</text>
  <g class="mono" font-size="10" fill="#9B948A">
    <text x="668" y="146">SWE</text><text x="668" y="174">QnA</text><text x="668" y="202">DSQA</text>
  </g>
  <g stroke="#2F8F6B" stroke-width="2">
    <line x1="749.8" y1="142" x2="756.9" y2="142"/>
    <line x1="733.8" y1="170" x2="739.1" y2="170"/>
    <line x1="727.6" y1="198" x2="736.4" y2="198"/>
  </g>
  <g fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3">
    <circle cx="749.8" cy="142" r="4"/><circle cx="733.8" cy="170" r="4"/><circle cx="727.6" cy="198" r="4"/>
  </g>
  <g fill="#2B2722">
    <circle cx="756.9" cy="142" r="4"/><circle cx="739.1" cy="170" r="4"/><circle cx="736.4" cy="198" r="4"/>
  </g>
  <g class="mono" font-size="10" fill="#2F8F6B">
    <text x="892" y="146" text-anchor="end">0.84×</text><text x="892" y="174" text-anchor="end">0.64×</text><text x="892" y="202" text-anchor="end">0.61×</text>
  </g>

  <line x1="668" y1="236" x2="892" y2="236" stroke="#EFE9E1" stroke-width="1"/>

  <!-- Codex 组 -->
  <text class="zh" x="668" y="290" font-size="11" fill="#2B2722">Codex</text>
  <g class="mono" font-size="10" fill="#9B948A">
    <text x="668" y="318">SWE</text><text x="668" y="346">QnA</text><text x="668" y="374">DSQA</text>
  </g>
  <g stroke="#D97757" stroke-width="2">
    <line x1="744.4" y1="314" x2="847.6" y2="314"/>
    <line x1="757.8" y1="342" x2="790.7" y2="342"/>
    <line x1="715.1" y1="370" x2="756.9" y2="370"/>
  </g>
  <g fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3">
    <circle cx="744.4" cy="314" r="4"/><circle cx="757.8" cy="342" r="4"/><circle cx="715.1" cy="370" r="4"/>
  </g>
  <g fill="#2B2722">
    <circle cx="847.6" cy="314" r="4"/><circle cx="790.7" cy="342" r="4"/><circle cx="756.9" cy="370" r="4"/>
  </g>
  <g class="mono" font-size="10" fill="#C0453A">
    <text x="892" y="318" text-anchor="end">1.86×</text><text x="892" y="346" text-anchor="end">1.22×</text>
  </g>
  <text class="mono" x="892" y="374" font-size="10" fill="#2F8F6B" text-anchor="end">0.84×</text>
  <text class="zh" x="668" y="424" font-size="10.5" fill="#9B948A">Excluding wait, both are below solo</text>

  <!-- 图注 -->
  <line x1="40" y1="466" x2="40" y2="478" stroke="#9B948A" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="466" x2="48" y2="478" stroke="#D97757" stroke-width="2" stroke-linecap="round"/>
  <text class="zh" x="60" y="476" font-size="11.5" fill="#6B655C">Tick = 1 Host model call; both tracks show call density on the same time scale (illustrative)</text>
</svg>
