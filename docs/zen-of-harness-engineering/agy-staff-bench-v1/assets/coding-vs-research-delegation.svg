<svg viewBox="0 0 940 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3">
  <title id="t3">Research 与 Coding 的委派结构对比：Research 是发散采样的搜索树，走偏的支路在 Worker 子窗口内被剪掉，有效叶子经压缩后只交回一条结论；Coding 是边改边演化的依赖 DAG，每一步都暗含决策，执行中才暴露出 Brief 中不存在的依赖节点，与预设拓扑冲突，迫使 Worker 重新遍历、Host 返工</title>
  <style>
    .zh  { font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .mono{ font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
    .q   { font-family: Georgia,"Times New Roman",serif; font-style: italic; }
  </style>
  <defs>
    <pattern id="dots3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#2B2722" opacity="0.045"/>
    </pattern>
    <marker id="ah-ink3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B655C"/>
    </marker>
    <marker id="ah-green3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F8F6B"/>
    </marker>
    <marker id="ah-coral3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
    <marker id="ah-ghost3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#BDB6AB"/>
    </marker>
  </defs>

  <rect width="940" height="468" fill="#FFFFFF"/>
  <rect width="940" height="468" fill="url(#dots3)"/>

  <!-- ═══ 左栏：Research · 搜索树 ═══ -->
  <rect x="30" y="24" width="426" height="420" rx="16" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="52" y="54" font-size="15" font-weight="600" fill="#2B2722">Research · 发散采样的搜索树</text>
  <text class="mono" x="434" y="54" font-size="10.5" fill="#9B948A" text-anchor="end">DeepSearchQA · QnA</text>
  <text class="q" x="52" y="74" font-size="12" fill="#6B655C">“Search is compression”</text>
  <line x1="52" y1="88" x2="434" y2="88" stroke="#EFE9E1" stroke-width="1"/>

  <!-- Host 轨：只有问题与结论 -->
  <rect x="52" y="100" width="382" height="60" rx="8" fill="#F8F6F2" stroke="#E4DFD8" stroke-width="1"/>
  <text class="mono" x="64" y="114" font-size="10" fill="#9B948A">Host</text>
  <rect x="108" y="124" width="56" height="24" rx="6" fill="#2B2722"/>
  <text class="mono" x="136" y="140" font-size="11" fill="#FFFFFF" text-anchor="middle">Query</text>
  <rect x="362" y="124" width="60" height="24" rx="6" fill="#2F8F6B"/>
  <text class="zh" x="392" y="140.5" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">结论</text>

  <!-- Worker 轨：独立子窗口 -->
  <rect x="52" y="178" width="382" height="250" rx="8" fill="#F4FBF7" stroke="#A8D5B9" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text class="mono" x="64" y="196" font-size="10" fill="#2F8F6B">Worker</text>

  <!-- Query 下发 -->
  <line x1="136" y1="148" x2="136" y2="293" stroke="#6B655C" stroke-width="1.4" marker-end="url(#ah-ink3)"/>

  <!-- 被剪掉支路留下的噪音碎屑 -->
  <g stroke="#E4DFD8" stroke-width="3" stroke-linecap="round">
    <line x1="281" y1="203" x2="303" y2="203"/>
    <line x1="281" y1="211" x2="295" y2="211"/>
    <line x1="281" y1="397" x2="301" y2="397"/>
    <line x1="281" y1="405" x2="293" y2="405"/>
    <line x1="391" y1="385" x2="415" y2="385"/>
    <line x1="391" y1="393" x2="405" y2="393"/>
  </g>
  <g fill="#D8D2C9">
    <circle cx="312" cy="216" r="1.4"/>
    <circle cx="300" cy="385" r="1.4"/>
    <circle cx="318" cy="408" r="1.4"/>
    <circle cx="352" cy="404" r="1.4"/>
    <circle cx="246" cy="413" r="1.4"/>
    <circle cx="420" cy="402" r="1.4"/>
  </g>

  <!-- 有效边 -->
  <g fill="none" stroke="#6B655C" stroke-width="1.2">
    <path d="M142.5 303 C166 303, 162 231, 186 231"/>
    <path d="M142.5 303 H186"/>
    <path d="M226 231 C246 231, 246 251, 263.5 251"/>
    <path d="M272.5 251 H320.5"/>
    <path d="M226 303 C246 303, 246 287, 263.5 287"/>
    <path d="M272.5 287 H320.5"/>
    <path d="M226 303 C246 303, 246 319, 263.5 319"/>
    <path d="M272.5 319 H320.5"/>
  </g>

  <!-- 走偏被剪掉的边 -->
  <g fill="none" stroke="#BDB6AB" stroke-width="1.2" stroke-dasharray="3 3">
    <path d="M226 231 C246 231, 246 207, 262 207"/>
    <path d="M142.5 303 C166 303, 162 375, 186 375"/>
    <path d="M226 375 C246 375, 246 401, 262 401"/>
    <path d="M226 375 C246 375, 246 361, 263.5 361"/>
    <path d="M272.5 361 C296 361, 300 371, 321.5 371"/>
    <path d="M330.5 371 C352 371, 356 389, 372 389"/>
  </g>

  <!-- 根节点 -->
  <circle cx="136" cy="303" r="6.5" fill="#2B2722"/>

  <!-- 一级采样 -->
  <rect x="186" y="222" width="40" height="18" rx="9" fill="#FFFFFF" stroke="#6B655C" stroke-width="1.1"/>
  <text class="mono" x="206" y="234.5" font-size="9.5" fill="#2B2722" text-anchor="middle">web</text>
  <rect x="186" y="294" width="40" height="18" rx="9" fill="#FFFFFF" stroke="#6B655C" stroke-width="1.1"/>
  <text class="mono" x="206" y="306.5" font-size="9.5" fill="#2B2722" text-anchor="middle">repo</text>
  <rect x="186" y="366" width="40" height="18" rx="9" fill="#FFFFFF" stroke="#BDB6AB" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text class="mono" x="206" y="378.5" font-size="9.5" fill="#9B948A" text-anchor="middle">docs</text>

  <!-- 中间节点 -->
  <g fill="#FFFFFF" stroke="#6B655C" stroke-width="1.2">
    <circle cx="268" cy="251" r="4.5"/>
    <circle cx="268" cy="287" r="4.5"/>
    <circle cx="268" cy="319" r="4.5"/>
  </g>
  <g fill="#FFFFFF" stroke="#BDB6AB" stroke-width="1.2">
    <circle cx="268" cy="361" r="4.5"/>
    <circle cx="326" cy="371" r="4.5"/>
  </g>

  <!-- 剪枝 -->
  <g stroke="#B5ADA3" stroke-width="1.6" stroke-linecap="round">
    <path d="M263.5 202.5 L272.5 211.5 M272.5 202.5 L263.5 211.5"/>
    <path d="M263.5 396.5 L272.5 405.5 M272.5 396.5 L263.5 405.5"/>
    <path d="M373.5 384.5 L382.5 393.5 M382.5 384.5 L373.5 393.5"/>
  </g>

  <!-- 有效叶子 -->
  <g fill="#2F8F6B">
    <circle cx="326" cy="251" r="5.5"/>
    <circle cx="326" cy="287" r="5.5"/>
    <circle cx="326" cy="319" r="5.5"/>
  </g>

  <!-- 汇聚压缩 -->
  <g fill="none" stroke="#2F8F6B" stroke-width="1.5">
    <path d="M331.5 251 C356 251, 370 250, 372 237"/>
    <path d="M331.5 287 C366 287, 392 270, 392 237"/>
    <path d="M331.5 319 C380 319, 410 292, 412 237"/>
  </g>
  <polygon points="356,236 428,236 403,198 381,198" fill="#FFFFFF" stroke="#2F8F6B" stroke-width="1.3" stroke-linejoin="round"/>
  <text class="mono" x="392" y="227" font-size="8.5" fill="#2F8F6B" text-anchor="middle">Compress</text>

  <!-- 唯一一条回传 -->
  <line x1="392" y1="198" x2="392" y2="151" stroke="#2F8F6B" stroke-width="1.8" marker-end="url(#ah-green3)"/>

  <!-- ═══ 右栏：Coding · 动态 DAG ═══ -->
  <rect x="484" y="24" width="426" height="420" rx="16" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.4"/>
  <text class="zh" x="506" y="54" font-size="15" font-weight="600" fill="#2B2722">Coding · 动态演化的依赖 DAG</text>
  <text class="mono" x="888" y="54" font-size="10.5" fill="#9B948A" text-anchor="end">SWE-bench</text>
  <text class="q" x="506" y="74" font-size="12" fill="#6B655C">“Actions carry implicit decisions”</text>
  <line x1="506" y1="88" x2="888" y2="88" stroke="#EFE9E1" stroke-width="1"/>

  <!-- Host 轨：静态 Brief 预设的拓扑 + 返工 -->
  <rect x="506" y="100" width="382" height="60" rx="8" fill="#F8F6F2" stroke="#E4DFD8" stroke-width="1"/>
  <text class="mono" x="518" y="114" font-size="10" fill="#9B948A">Host</text>
  <text class="mono" x="601" y="139" font-size="10" fill="#6B655C" text-anchor="end">Brief</text>
  <g fill="#FFFFFF" stroke="#BDB6AB" stroke-width="1.1" stroke-dasharray="3 2">
    <rect x="607" y="125" width="34" height="20" rx="5"/>
    <rect x="667" y="125" width="34" height="20" rx="5"/>
    <rect x="787" y="125" width="34" height="20" rx="5"/>
  </g>
  <g class="mono" font-size="10" fill="#9B948A" text-anchor="middle">
    <text x="624" y="138.5">A</text>
    <text x="684" y="138.5">B</text>
    <text x="804" y="138.5">C</text>
  </g>
  <g stroke="#BDB6AB" stroke-width="1.1" stroke-dasharray="3 2">
    <line x1="641" y1="135" x2="664" y2="135" marker-end="url(#ah-ghost3)"/>
    <line x1="701" y1="135" x2="784" y2="135" marker-end="url(#ah-ghost3)"/>
  </g>
  <rect x="840" y="124" width="40" height="24" rx="6" fill="#D97757"/>
  <text class="zh" x="860" y="140.5" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">返工</text>

  <!-- Worker 轨 -->
  <rect x="506" y="178" width="382" height="250" rx="8" fill="#FDF6F2" stroke="#E8C9B8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text class="mono" x="518" y="196" font-size="10" fill="#B85C39">Worker</text>

  <!-- Brief 下发 + 预设与实际的对位 -->
  <line x1="624" y1="146" x2="624" y2="200" stroke="#6B655C" stroke-width="1.4" marker-end="url(#ah-ink3)"/>
  <g stroke="#D8D2C9" stroke-width="1" stroke-dasharray="1.5 3">
    <line x1="684" y1="146" x2="684" y2="254"/>
    <line x1="804" y1="146" x2="804" y2="358"/>
  </g>

  <!-- 预设拓扑里不存在的 D：冲突 -->
  <circle cx="744" cy="135" r="2.5" fill="#D97757"/>
  <g stroke="#D97757" stroke-width="1.2" stroke-dasharray="2 3">
    <line x1="744" y1="138" x2="744" y2="159"/>
    <line x1="744" y1="179" x2="744" y2="306"/>
  </g>
  <circle cx="744" cy="169" r="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.3"/>
  <path d="M746 160 L739 171 L744 171 L742 178 L749 167 L744 167 Z" fill="#D97757"/>

  <!-- 重新遍历 -->
  <path d="M728 333 V396 Q728 404 720 404 H548 Q540 404 540 396 V224 Q540 216 548 216 H597" fill="none" stroke="#D97757" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-coral3)"/>
  <text class="zh" x="634" y="397" font-size="10.5" fill="#B85C39" text-anchor="middle">重新遍历</text>

  <!-- 实际拓扑：严格的先后依赖 -->
  <g fill="none" stroke="#6B655C" stroke-width="1.3">
    <path d="M624 229 V260 Q624 268 632 268 H657" marker-end="url(#ah-ink3)"/>
    <path d="M684 281 V312 Q684 320 692 320 H717" marker-end="url(#ah-ink3)"/>
    <path d="M744 333 V364 Q744 372 752 372 H777" marker-end="url(#ah-ink3)"/>
  </g>
  <!-- 每条边都暗含决策 -->
  <g fill="#2B2722">
    <polygon points="624,239.5 628.5,244 624,248.5 619.5,244"/>
    <polygon points="684,291.5 688.5,296 684,300.5 679.5,296"/>
    <polygon points="744,343.5 748.5,348 744,352.5 739.5,348"/>
  </g>

  <rect x="600" y="203" width="48" height="26" rx="6" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3"/>
  <text class="zh" x="624" y="220" font-size="11" fill="#2B2722" text-anchor="middle">A 接口</text>
  <rect x="660" y="255" width="48" height="26" rx="6" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3"/>
  <text class="zh" x="684" y="272" font-size="11" fill="#2B2722" text-anchor="middle">B 状态</text>
  <rect x="720" y="307" width="48" height="26" rx="6" fill="#F3DCD0" stroke="#D97757" stroke-width="1.4"/>
  <text class="zh" x="744" y="324" font-size="11" font-weight="600" fill="#B85C39" text-anchor="middle">D ?</text>
  <rect x="780" y="359" width="48" height="26" rx="6" fill="#FFFFFF" stroke="#2B2722" stroke-width="1.3"/>
  <text class="zh" x="804" y="376" font-size="11" fill="#2B2722" text-anchor="middle">C 下游</text>

  <!-- 交回 Host ⇄ 打回返工 -->
  <path d="M828 366 H842 Q850 366 850 358 V152" fill="none" stroke="#6B655C" stroke-width="1.3" marker-end="url(#ah-ink3)"/>
  <path d="M870 149 V370 Q870 378 862 378 H832" fill="none" stroke="#D97757" stroke-width="1.5" marker-end="url(#ah-coral3)"/>
</svg>
